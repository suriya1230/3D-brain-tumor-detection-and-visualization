# Controlled vocabulary for CNS tumour types, seeded from the WHO
# Classification of Tumours of the Central Nervous System, 5th edition (2021)
# ("WHO CNS5"). Canonical names and category groupings are WHO's; that
# structure is a fact, not copyrightable prose (spec §3).
#
# Every leaf tumour type in WHO CNS5 has a stub entry here so the vocabulary
# is structurally complete. `synonyms` is the hand-curated part and is NOT
# complete — it covers the entities that actually appear in the NCI PDQ CNS
# treatment summaries used as ingest fixtures, plus their common older-WHO
# and colloquial names. Extending synonym coverage for the long tail of rare
# entities is future work; this file is meant to be read and extended by a
# person, not regenerated.
#
# `id` is the stable key stored in Chunk.tumour_types. Never rename an `id`
# once chunks reference it — add a synonym instead, or migrate + reindex.

categories:
  - adult_type_diffuse_glioma
  - pediatric_type_diffuse_low_grade_glioma
  - pediatric_type_diffuse_high_grade_glioma
  - circumscribed_astrocytic_glioma
  - glioneuronal_and_neuronal_tumor
  - ependymal_tumor
  - choroid_plexus_tumor
  - embryonal_tumor
  - pineal_tumor
  - cranial_and_paraspinal_nerve_tumor
  - meningioma
  - mesenchymal_non_meningothelial_tumor
  - melanocytic_tumor
  - hematolymphoid_tumor
  - germ_cell_tumor
  - sellar_region_tumor
  - cns_metastasis

